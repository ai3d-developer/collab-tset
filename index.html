<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple 4 Buttons</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a 70%);
      color: #f8fafc;
      padding: 20px;
    }

    .container {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #94a3b8;
      font-weight: 400;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .btn {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn .icon {
      font-size: 22px;
      transition: transform 0.25s ease;
    }

    .btn:hover .icon {
      transform: scale(1.15);
    }

    /* Button Variants */
    .btn-1 {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.4);
    }
    .btn-1:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px -4px rgba(99, 102, 241, 0.6);
    }

    .btn-2 {
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(6, 182, 212, 0.4);
    }
    .btn-2:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px -4px rgba(6, 182, 212, 0.6);
    }

    .btn-3 {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
    }
    .btn-3:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px -4px rgba(16, 185, 129, 0.6);
    }

    .btn-4 {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(245, 158, 11, 0.4);
    }
    .btn-4:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px -4px rgba(245, 158, 11, 0.6);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    /* Selected Status Text */
    .status-msg {
      margin-top: 24px;
      font-size: 14px;
      color: #cbd5e1;
      min-height: 20px;
      transition: all 0.3s ease;
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 24px;
      }
      .button-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="header">
      <span class="badge">Dashboard</span>
      <h1 class="title">Choose an Action</h1>
      <p class="subtitle">Select any option below to get started</p>
    </div>

    <div class="button-grid">
      <button class="btn btn-1" id="btn-1" onclick="handleClick('Button 1 Clicked!')">
        <span class="icon">🚀</span>
        <span>Button 1</span>
      </button>

      <button class="btn btn-2" id="btn-2" onclick="handleClick('Button 2 Clicked!')">
        <span class="icon">⚡</span>
        <span>Button 2</span>
      </button>

      <button class="btn btn-3" id="btn-3" onclick="handleClick('Button 3 Clicked!')">
        <span class="icon">✨</span>
        <span>Button 3</span>
      </button>

      <button class="btn btn-4" id="btn-4" onclick="handleClick('Button 4 Clicked!')">
        <span class="icon">🎯</span>
        <span>Button 4</span>
      </button>
    </div>

    <div class="status-msg" id="statusMessage">No button clicked yet</div>
  </main>

  <script>
    function handleClick(name) {
      const status = document.getElementById('statusMessage');
      status.style.opacity = '0';
      setTimeout(() => {
        status.textContent = 'Selected: ' + name;
        status.style.opacity = '1';
        status.style.color = '#38bdf8';
      }, 150);
    }
  </script>
</body>
</html>
